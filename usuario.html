<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários | Gestão Alimentar Escolar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a class="navbar-marca" href="dashboard.html">🍽️ GESTÃO ALIMENTAR</a>
      <div class="navbar-menu">
        <a href="dashboard.html">Painel</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="registro.html">Registro</a>
        <a href="cardapio.html">Cardápio</a>
        <a href="relatorio.html">Relatórios</a>
        <a href="usuario.html" class="ativo">Usuários</a>
      </div>
      <div class="navbar-usuario">
        <span id="usuario-nome">Admin</span>
        <button class="sair" onclick="Auth.sair(); window.location.href='index.html';">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <h2 style="margin: 20px 0 10px;">Gerenciar Usuários</h2>

    <div class="card">
      <div class="card-titulo">Novo Usuário</div>
      <div id="alerta-usuario" class="alerta oculto"></div>
      <form id="form-usuario">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-grupo">
            <label for="u-pessoa">Vincular a pessoa já cadastrada</label>
            <select id="u-pessoa">
              <option value="">Selecionar pessoa...</option>
            </select>
          </div>
          <div class="form-grupo">
            <label for="u-perfil">Perfil de Acesso</label>
            <select id="u-perfil" required>
              <option value="nutricionista">Nutricionista</option>
              <option value="professor">Professor</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-grupo">
            <label for="u-usuario">Usuário (login)</label>
            <input type="text" id="u-usuario" required placeholder="Ex: 2026003">
          </div>
          <div class="form-grupo">
            <label for="u-senha">Senha</label>
            <input type="text" id="u-senha" required value="123456">
          </div>
        </div>
        <button type="submit" class="btn btn-primario" style="margin-top:10px;">Criar Usuário</button>
      </form>
    </div>

    <div class="card">
      <div class="card-titulo">Usuários Cadastrados</div>
      <div id="tabela-usuarios">
        <p>Carregando...</p>
      </div>
    </div>
  </main>

  <script src="js/dados-iniciais.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/usuario.js"></script>
</body>
</html>
