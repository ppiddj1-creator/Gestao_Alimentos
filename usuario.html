<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários | Gestão Alimentar Escolar</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo-ga.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-conteudo">
      <a href="dashboard.html" class="navbar-marca">
        <img src="assets/img/logo-ga-branca.svg" alt="Logo Gestão Alimentar Escolar" class="navbar-logo">
        <span class="navbar-texto">
          <strong>Gestão Alimentar</strong>
          <small>Escolar</small>
        </span>
      </a>
      <button class="menu-toggle" id="btn-menu" aria-label="Abrir ou fechar menu" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
      <ul class="navbar-menu" id="navbar-menu">
        <li><a href="dashboard.html">Painel</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
        <li><a href="registro.html">Registro</a></li>
        <li><a href="cardapio.html">Cardápio</a></li>
        <li><a href="relatorio.html">Relatórios</a></li>
        <li><a href="usuario.html" class="ativo">Usuários</a></li>
      </ul>
      <div class="navbar-acoes">
        <div class="navbar-usuario">
          <span class="avatar" id="avatar-usuario"></span>
          <span class="nome-usuario" id="usuario-nome">Admin</span>
          <button class="btn-sair" onclick="Auth.sair(); window.location.href='index.html';">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="pagina-cabecalho">
      <div>
        <h1 class="pagina-titulo">Gestão de Usuários</h1>
        <p class="pagina-subtitulo">Defina quem pode acessar o sistema e com qual perfil.</p>
      </div>
    </header>

    <div id="alerta-usuario" class="alerta oculto"></div>

    <div class="card">
      <div class="card-titulo">
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
          Novo Usuário
        </span>
        <span class="badge badge-suave">perfis de acesso</span>
      </div>

      <form id="form-usuario" class="form-grade">
        <div class="campo-fla">
          <span class="campo-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <select id="u-pessoa" required>
            <option value="">Selecionar pessoa...</option>
          </select>
          <label for="u-pessoa">Pessoa</label>
        </div>

        <div class="campo-fla">
          <span class="campo-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 7h-9"/>
              <path d="M14 17H5"/>
              <circle cx="17" cy="17" r="3"/>
              <circle cx="7" cy="7" r="3"/>
            </svg>
          </span>
          <select id="u-perfil" required>
            <option value=""></option>
            <option value="admin">Administrador</option>
            <option value="funcionario">Funcionário</option>
          </select>
          <label for="u-perfil">Perfil de Acesso</label>
        </div>

        <div class="campo-fla">
          <span class="campo-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" id="u-usuario" required placeholder=" ">
          <label for="u-usuario">Usuário (login)</label>
        </div>

        <div class="campo-fla">
          <span class="campo-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="u-senha" required placeholder=" ">
          <label for="u-senha">Senha</label>
        </div>

        <div class="form-acoes">
          <button type="submit" class="btn btn-primario">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            Salvar
          </button>
          <button type="button" class="btn btn-cinza" onclick="document.getElementById('form-usuario').reset(); document.getElementById('u-pessoa').selectedIndex = 0;">
            Limpar
          </button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-titulo">
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Usuários do Sistema
        </span>
        <span class="badge badge-ativo">ativos</span>
      </div>
      <div class="tabela-rolagem">
        <div id="tabela-usuarios">
          <div class="skeleton" style="height:46px; margin-bottom:10px;"></div>
          <div class="skeleton" style="height:46px; margin-bottom:10px;"></div>
          <div class="skeleton" style="height:46px;"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/dados-iniciais.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/usuario.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
