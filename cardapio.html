<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio | Gestão Alimentar Escolar</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo-ga.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-conteudo">
      <a href="dashboard.html" class="navbar-marca">
        <img src="assets/img/logo-ga-branca.svg" alt="Logo Gestão Alimentar Escolar" class="navbar-logo">
        <span class="navbar-texto">
          <strong>Gestão Alimentar</strong>
          <small>Escolar</small>
        </span>
      </a>
      <button class="menu-toggle" id="btn-menu" aria-label="Abrir ou fechar menu" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
      <ul class="navbar-menu" id="navbar-menu">
        <li><a href="dashboard.html">Painel</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
        <li><a href="registro.html">Registro</a></li>
        <li><a href="cardapio.html" class="ativo">Cardápio</a></li>
        <li><a href="relatorio.html">Relatórios</a></li>
        <li><a href="usuario.html">Usuários</a></li>
      </ul>
      <div class="navbar-acoes">
        <div class="navbar-usuario">
          <span class="avatar" id="avatar-usuario"></span>
          <span class="nome-usuario" id="usuario-nome">Admin</span>
          <button class="btn-sair" onclick="Auth.sair(); window.location.href='index.html';">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="pagina-cabecalho">
      <div>
        <h1 class="pagina-titulo">Cardápio do Almoço</h1>
        <p class="pagina-subtitulo">Planejamento semanal das refeições da escola.</p>
      </div>
      <div class="pagina-acoes">
        <button class="btn btn-primario" onclick="Cardapio.abrirModalNova()">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Editar Cardápio
        </button>
      </div>
    </header>

    <div class="card">
      <div class="card-titulo">
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
            <path d="M7 2v20"/>
            <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
          Cardápio da Semana
        </span>
        <span class="badge badge-suave">segunda a sexta</span>
      </div>
      <div id="grade-cardapio-container">
        <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:18px;">
          <div class="skeleton" style="height:170px;"></div>
          <div class="skeleton" style="height:170px;"></div>
          <div class="skeleton" style="height:170px;"></div>
          <div class="skeleton" style="height:170px;"></div>
          <div class="skeleton" style="height:170px;"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="modal-cardapio" class="modal-overlay" style="display:none;" onclick="Cardapio.fecharModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-cabecalho">
        <h3 id="modal-titulo">Editar Cardápio do Dia</h3>
        <button class="modal-fechar" onclick="document.getElementById('modal-cardapio').style.display='none'">&times;</button>
      </div>
      <form id="form-cardapio">
        <div class="campo-fla">
          <span class="campo-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
          <select id="c-dia" required>
            <option value=""></option>
            <option value="segunda">Segunda-feira</option>
            <option value="terca">Terça-feira</option>
            <option value="quarta">Quarta-feira</option>
            <option value="quinta">Quinta-feira</option>
            <option value="sexta">Sexta-feira</option>
          </select>
          <label for="c-dia">Dia da Semana</label>
        </div>
        <div class="campo-fla">
          <span class="campo-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
              <path d="M7 2v20"/>
              <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
            </svg>
          </span>
          <textarea id="c-prato" rows="3" required placeholder=" "></textarea>
          <label for="c-prato">Prato do Almoço</label>
        </div>
        <div class="form-acoes">
          <button type="submit" class="btn btn-primario" style="width:100%;">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            Salvar Cardápio
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/database-supabase.js"></script>
  <script src="js/dados-iniciais.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cardapio.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
