<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio | Gestão Alimentar Escolar</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .grade-cardapio {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .grade-cardapio th,
    .grade-cardapio td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
      vertical-align: middle;
    }

    .grade-cardapio th {
      background: var(--verde-claro);
      color: var(--verde-escuro);
      font-weight: 700;
    }

    .grade-cardapio .hoje {
      background: #e8f5e9;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--branco);
      border-radius: 12px;
      padding: 30px;
      max-width: 450px;
      width: 90%;
    }

    .modal-card h3 {
      margin-bottom: 16px;
      color: var(--verde-escuro);
    }

    .modal-fechar {
      float: right;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }

    .modal-fechar:hover { color: #333; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a class="navbar-marca" href="dashboard.html">🍽️ GESTÃO ALIMENTAR</a>
      <div class="navbar-menu">
        <a href="dashboard.html">Painel</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="registro.html">Registro</a>
        <a href="cardapio.html" class="ativo">Cardápio</a>
        <a href="relatorio.html">Relatórios</a>
        <a href="usuario.html">Usuários</a>
      </div>
      <div class="navbar-usuario">
        <span id="usuario-nome">Admin</span>
        <button class="sair" onclick="Auth.sair(); window.location.href='index.html';">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <h2 style="margin: 20px 0 10px;">Cardápio do Almoço (Semanal)</h2>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div class="card-titulo" style="border:none; margin:0; padding:0;">Cardápio da Semana</div>
        <div>
          <button class="btn btn-primario" onclick="Cardapio.abrirModalNova()">+ Editar Cardápio</button>
        </div>
      </div>
      <div id="grade-cardapio-container" style="overflow-x:auto;">
        <p>Carregando...</p>
      </div>
    </div>
  </main>

  <div id="modal-cardapio" class="modal-overlay" style="display:none;" onclick="Cardapio.fecharModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-fechar" onclick="document.getElementById('modal-cardapio').style.display='none'">&times;</button>
      <h3 id="modal-titulo">Editar Cardápio do Dia</h3>
      <form id="form-cardapio">
        <div class="form-grupo">
          <label>Dia da Semana</label>
          <select id="c-dia" required>
            <option value="segunda">Segunda-feira</option>
            <option value="terca">Terça-feira</option>
            <option value="quarta">Quarta-feira</option>
            <option value="quinta">Quinta-feira</option>
            <option value="sexta">Sexta-feira</option>
          </select>
        </div>
        <div class="form-grupo">
          <label for="c-prato">Prato do Almoço</label>
          <textarea id="c-prato" rows="3" required placeholder="Ex: Arroz com frango, feijão e salada"></textarea>
        </div>
        <button type="submit" class="btn btn-primario">Salvar</button>
      </form>
    </div>
  </div>

  <script src="js/dados-iniciais.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cardapio.js"></script>
</body>
</html>
