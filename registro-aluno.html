<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmação de Almoço | Gestão Alimentar Escolar</title>
  <link rel="icon" type="image/png" href="assets/img/logo-nutrigestao-verde.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-aluno">
  <div class="aluno-banner">
    <div class="aluno-barra">
      <span class="aluno-marca">
        <img src="assets/img/logo-nutrigestao-branca.png" alt="Logo NutriGestão" class="navbar-logo">
        <span class="navbar-texto">
          <strong>Gestão Alimentar</strong>
          <small>Escolar</small>
        </span>
      </span>
      <div class="aluno-barra-acoes">
        <button type="button" class="aluno-sair" onclick="RegistroAluno.abrirModalSenha()">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Alterar senha
        </button>
        <a class="aluno-sair" href="index.html" onclick="Auth.sair(); return true;">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sair
        </a>
      </div>
    </div>
    <div class="aluno-conteudo">
      <div class="aluno-titulo">
        <span class="aluno-avatar">🙋</span>
        <div>
          <h1 id="aluno-nome">Olá!</h1>
          <p id="aluno-matricula">Matrícula: —</p>
        </div>
      </div>
      <p class="aluno-cartao" id="aluno-data"></p>
      <p class="aluno-cardapio" id="cardapio-hoje-aluno"></p>
    </div>
  </div>

  <main class="aluno-corpo">
    <section class="aluno-card">
      <h2>Você vai almoçar amanhã?</h2>
      <p class="aluno-sub">Confirme sua presença para o almoço. Você pode alterar até às 23h59 de hoje.</p>

      <div class="opcao-grupo">
        <button type="button" class="opcao-btn sim" onclick="RegistroAluno.registrar(true)">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
          SIM, vou almoçar
        </button>
        <button type="button" class="opcao-btn nao" onclick="RegistroAluno.registrar(false)">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
          NÃO vou almoçar
        </button>
      </div>

      <div id="alerta-aluno" class="alerta alerta-sucesso oculto"></div>

      <p id="status-registro" class="status-msg pendente">Nenhuma opção registrada ainda</p>
      <p id="prazo-info" class="prazo-info">Prazo: até 23h59 de hoje.</p>
    </section>

    <p class="aluno-rodape">🌿 Gestão Alimentar Escolar · contamos com você!</p>
  </main>

  <div id="modal-senha" class="modal-overlay" style="display:none;" onclick="RegistroAluno.fecharModalSenha(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-cabecalho">
        <h3>Alterar Senha</h3>
        <button class="modal-fechar" onclick="document.getElementById('modal-senha').style.display='none'">&times;</button>
      </div>
      <form id="form-alterar-senha">
        <div class="campo-fla">
          <span class="campo-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="s-atual" required placeholder=" " autocomplete="current-password">
          <label for="s-atual">Senha Atual</label>
        </div>
        <div class="campo-fla">
          <span class="campo-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="s-nova" required placeholder=" " minlength="6" autocomplete="new-password">
          <label for="s-nova">Nova Senha (mín. 6 caracteres)</label>
        </div>
        <div class="campo-fla">
          <span class="campo-icone">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </span>
          <input type="password" id="s-confirmar" required placeholder=" " minlength="6" autocomplete="new-password">
          <label for="s-confirmar">Confirmar Nova Senha</label>
        </div>
        <div id="alerta-senha" class="alerta oculto"></div>
        <div class="form-acoes">
          <button type="submit" class="btn btn-primario" style="width:100%;">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            Salvar Nova Senha
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/database-supabase.js"></script>
  <script src="js/dados-iniciais.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/registro-aluno.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
